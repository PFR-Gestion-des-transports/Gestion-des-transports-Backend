name: workflow-gdt

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Build avec Maven
        run: mvn -B clean package -DskipTests

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4

      - name: "Télécharger les résultats CodeQL"
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: results/codeql.csv

      - name: Construire avec Maven
        run: mvn -B clean verify -Dspring.profiles.active=test      
      
      - name: Sauvegarder le rapport JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco